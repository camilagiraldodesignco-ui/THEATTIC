<nav>

<section class="producto">

<div class="imagen">

<img id="imagenProducto" src="" alt="Producto">

<div class="info">

<h1 id="nombreProducto"></h1>

<p class="precio" id="precioProducto"></p>

<button class="favorito"> Añadir a favoritos</button>

<h3>Descripción</h3>

<p id="descripcionProducto"></p>

<ul>

<li id="anioProducto"></li>

<li id="origenProducto"></li>

<li id="materialProducto"></li>

<li id="estadoProducto"></li>

</ul>

<div class="vendedor">

<h3>Vendedor</h3>

<p><strong id="vendedorProducto"></strong></p>

<p id="calificacionProducto"></p>

<p id="ventasProducto"></p>

</div>

<div class="botones">

<button class="comprar">

Comprar Ahora

</button>

<button class="contactar">

Contactar Vendedor

</button>

</div>

</div>
